<form>
    {{#if actors}}
        <div class="form-group">
            <label for="characterId">{{localize "CS.dialogs.characterRole.character"}}</label>
            <select name="characterId">
                {{selectOptions actors selected=id}}
            </select>
        </div>
    {{else}}
        <input type="hidden" name="characterId" value="{{id}}"/>
    {{/if}}
    <div class="form-group">
        <label for="characterRole">{{localize "CS.dialogs.characterRole.label"}}</label>
        <select name="characterRole">
            {{selectOptions choices selected=value localize=true}}
        </select>
    </div>
    {{> (csFormGroup) id="description" inputCssClass="size200" value=description placeHolder="CS.sheets.generalLabels.description" labelText="CS.sheets.generalLabels.description" dataType=String }}
</form>
